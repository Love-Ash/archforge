<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>archforge — PPTX 검사</title>
<style>
  :root {
    --bg:#F5F5F7; --surface:#FFFFFF; --ink:#1D1D1F; --subdued:#6E6E73;
    --hairline:#D2D2D7; --control-line:#86868B;
    --accent:#0071E3; --accent-hover:#0068D1; --accent-soft:#F2F8FF;
    --link:#0066CC;
    --error:#B42318; --warn:#7A4E00; --pass:#176B42;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body {
    background:var(--bg); color:var(--ink); min-height:100vh;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",
      "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    font-size:15px; line-height:1.5;
  }
  .shell {
    max-width:960px; margin-inline:auto;
    padding-left:calc(32px + env(safe-area-inset-left));
    padding-right:calc(32px + env(safe-area-inset-right));
  }
  @media (max-width:679px) { .shell { padding-left:calc(20px + env(safe-area-inset-left)); padding-right:calc(20px + env(safe-area-inset-right)); } }
  @media (max-width:319px) { .shell { padding-left:16px; padding-right:16px; } }

  .bar { height:56px; display:flex; align-items:center; }
  .bar .brand { font-size:15px; line-height:20px; font-weight:600; letter-spacing:-0.01em; }

  .hero { max-width:680px; margin:56px auto 0; text-align:center; }
  @media (max-width:679px) { .hero { margin-top:32px; } }
  .hero h1 { margin:0; font-size:40px; line-height:48px; font-weight:700; letter-spacing:-0.025em; }
  @media (max-width:679px) { .hero h1 { font-size:32px; line-height:40px; } }
  .hero p { margin:12px 0 0; font-size:17px; line-height:26px; color:var(--subdued); }

  #drop {
    display:block; width:min(100%,720px); margin:32px auto 0;
    background:var(--surface); border:1px solid var(--control-line); border-radius:20px;
    min-height:220px; padding:40px 24px; text-align:center; cursor:pointer;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
    transition:background-color 160ms ease-out, border-color 160ms ease-out;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  @media (max-width:679px) { #drop { margin-top:24px; min-height:184px; padding:28px 16px; border-radius:16px; } }
  @media (max-width:319px) { #drop { min-height:168px; } }
  #drop input {
    position:absolute; width:1px; height:1px; margin:-1px; padding:0;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
  }
  #drop:focus-within { box-shadow:0 0 0 4px rgba(0,113,227,.22); }
  .pick {
    display:inline-flex; align-items:center; height:44px; padding:0 22px;
    background:var(--accent); color:#fff; border-radius:22px;
    font-size:15px; line-height:20px; font-weight:600;
    transition:background-color 160ms ease-out;
  }
  .drag-hint { margin-top:12px; font-size:14px; line-height:21px; color:var(--subdued); }
  .privacy { margin-top:16px; font-size:13px; line-height:20px; color:var(--subdued); max-width:34rem; }
  @media (hover:hover) {
    #drop:hover { background:#FCFCFD; border-color:var(--subdued); }
    #drop:hover .pick { background:var(--accent-hover); }
  }
  #drop .ondrag { display:none; font-size:15px; line-height:20px; font-weight:600; }
  #drop.hot { background:var(--accent-soft); box-shadow:inset 0 0 0 1px var(--accent), 0 1px 2px rgba(0,0,0,.04); }
  #drop.hot .idle { display:none; }
  #drop.hot .ondrag { display:block; }

  #drop.busy { cursor:progress; pointer-events:none; }
  #drop.busy .idle, #drop.busy .ondrag { display:none; }
  #drop .busybox { display:none; }
  #drop.busy .busybox { display:block; }
  .busytitle { font-size:15px; line-height:20px; font-weight:600; }
  .busysub { margin-top:8px; font-size:13px; line-height:20px; color:var(--subdued); }
  .meter { width:min(240px,80%); height:2px; margin:16px auto 0; background:var(--hairline);
           border-radius:1px; overflow:hidden; position:relative; }
  .meter::after {
    content:""; position:absolute; inset:0; width:40%; background:var(--accent); border-radius:1px;
    animation:slide 1.2s ease-in-out infinite;
  }
  @keyframes slide { 0%{transform:translateX(-100%)} 100%{transform:translateX(350%)} }
  @media (prefers-reduced-motion:reduce) { .meter::after { animation:none; width:100%; } }

  #drop.done {
    min-height:80px; padding:0 24px; flex-direction:row; justify-content:space-between;
    display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:16px;
    text-align:left;
  }
  #drop.done .idle, #drop.done .ondrag, #drop.done .busybox { display:none; }
  #drop .donebox { display:none; }
  #drop.done .donebox { display:contents; }
  .donename { font-size:14px; line-height:21px; font-weight:500; overflow:hidden;
              text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .repick { font-size:14px; line-height:21px; font-weight:600; color:var(--accent); white-space:nowrap; }
  #drop.err { border-color:var(--error); }

  #status { width:min(100%,720px); margin:16px auto 0; min-height:52px;
            font-size:13px; line-height:20px; color:var(--subdued); text-align:center;
            white-space:pre-line; }

  #result { width:min(100%,720px); margin:0 auto; }
  .card {
    background:var(--surface); border:1px solid var(--hairline); border-radius:16px;
    padding:20px 24px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:16px;
    align-items:center;
  }
  @media (max-width:679px) { .card { grid-template-columns:1fr; gap:12px; padding:18px 16px; } }
  .verdict-title { margin:0; font-size:22px; line-height:30px; font-weight:700; display:flex;
                   align-items:center; gap:10px; outline:none; }
  .dot { width:10px; height:10px; border-radius:50%; flex:none; }
  .dot.err { background:var(--error); } .dot.warn { background:var(--warn); } .dot.ok { background:var(--pass); }
  .verdict-sub { margin:4px 0 0 20px; font-size:14px; line-height:21px; color:var(--subdued); }
  .meta { text-align:right; min-width:0; }
  @media (max-width:679px) { .meta { text-align:left; } }
  .meta .fname { font-size:13px; line-height:20px; overflow:hidden; text-overflow:ellipsis;
                 white-space:nowrap; }
  .meta .ver { font-size:12px; line-height:18px; color:var(--subdued); }

  .findings-head { display:flex; align-items:baseline; justify-content:space-between;
                   gap:16px; margin:32px 0 0; }
  .findings-head h2 { margin:0; font-size:20px; line-height:28px; font-weight:600; }
  .findings-head a { font-size:13px; line-height:20px; color:var(--link); text-decoration:none; }
  .findings-head a:hover, .findings-head a:focus-visible { text-decoration:underline; }

  table { border-collapse:collapse; width:100%; margin-top:16px; table-layout:fixed; }
  th { text-align:left; font-size:12px; line-height:18px; font-weight:600; color:var(--subdued);
       padding:0 12px 10px 0; }
  col.c-code { width:96px; } col.c-page { width:72px; } col.c-msg { width:36%; }
  td { text-align:left; vertical-align:top; padding:16px 12px 16px 0;
       border-top:1px solid var(--hairline); }
  td.t-code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
              font-size:13px; line-height:20px; font-weight:600; white-space:nowrap; }
  td.t-code .dot { display:inline-block; width:6px; height:6px; margin-right:8px; vertical-align:2px; }
  td.t-page { font-size:13px; line-height:20px; color:var(--subdued); }
  td.t-msg { font-size:14px; line-height:21px; font-weight:500; min-width:0; overflow-wrap:anywhere; }
  td.t-det { font-size:13px; line-height:20px; color:var(--subdued); min-width:0; overflow-wrap:anywhere; }
  .sr { position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden;
        clip:rect(0 0 0 0); white-space:nowrap; }
  @media (max-width:679px) {
    table, tbody { display:block; }
    thead { position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); }
    tr { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px 16px;
         padding:16px 0; border-top:1px solid var(--hairline); }
    td { display:block; border:0; padding:0; }
    td.t-code { grid-column:1; grid-row:1; }
    td.t-page { grid-column:2; grid-row:1; justify-self:end; }
    td.t-msg { grid-column:1 / -1; }
    td.t-det { grid-column:1 / -1; }
  }
  .empty { margin:16px 0 0; font-size:14px; line-height:21px; color:var(--subdued); }

  footer { margin-top:72px; border-top:1px solid var(--hairline); padding:24px 0 32px;
           font-size:12px; line-height:19px; color:var(--subdued); }
  footer a { color:var(--link); text-decoration:none; }
  footer a:hover, footer a:focus-visible { text-decoration:underline; }
  footer .links { margin-top:4px; }
  footer .links a + a { margin-left:16px; }
</style>
</head>
<body>
<div class="shell">
  <div class="bar"><span class="brand">archforge</span></div>

  <div class="hero">
    <h1>PPTX 파일을 검사하세요</h1>
    <p>한글 폰트, 작은 글자, 겹친 요소를 배포 전에 확인합니다.</p>
  </div>

  <label id="drop">
    <input type="file" id="file" accept=".pptx">
    <span class="idle">
      <span class="pick">PPTX 파일 선택</span>
      <span class="drag-hint" style="display:block">또는 이곳에 끌어 놓으세요</span>
      <span class="privacy" style="display:block">검사는 이 브라우저에서만 실행되며, 파일은 전송되지 않습니다.</span>
    </span>
    <span class="ondrag">놓으면 검사를 시작합니다.</span>
    <span class="busybox">
      <span class="busytitle" id="busytitle">검사 엔진을 준비하고 있습니다.</span>
      <span class="busysub" id="busysub"></span>
      <span class="meter"></span>
    </span>
    <span class="donebox">
      <span class="donename" id="donename"></span>
      <span class="repick">다른 PPTX 선택</span>
    </span>
  </label>

  <div id="status" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="result"></div>

  <footer>
    브라우저 검사는 full 프로필을 사용하며, 렌더 기반 검사(W7)는 포함하지 않습니다.
    <div class="links">
      <a href="https://github.com/Love-Ash/archforge/tree/main/docs/rules">검사 규칙</a>
      <a href="https://pypi.org/project/archforge/">PyPI</a>
      <a href="https://github.com/Love-Ash/archforge">GitHub</a>
    </div>
  </footer>
</div>

<script type="text/plain" id="pycode">
import base64, json
open("/tmp/deck.pptx", "wb").write(base64.b64decode(deck_b64))
from archforge.lint import lint
from archforge.reporters import build_json_doc
errors, warns = lint("/tmp/deck.pptx", profile="full")
summary = {"error_count": len(errors), "warning_count": len(warns),
           "pass": not errors, "incomplete": any(f.code == "W18" for f in warns)}
doc = build_json_doc("deck.pptx", errors, warns, None, summary)
json.dumps(doc, ensure_ascii=False)
</script>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"
        integrity="sha384-i3R37b3tF+HWudsUf1VSEOY2YxwSNMqY8DQa9Z0O3xh+NkJ9o+yjcGyIi5huj+nB"
        crossorigin="anonymous"></script>
<script>
"use strict";
var ARCHFORGE_VERSION = "0.9.2";   // pinned: the verdict states which engine judged the deck
var pyReady = null;

var drop = document.getElementById("drop");
var statusEl = document.getElementById("status");

function setBusy(title, sub) {
  drop.classList.add("busy");
  drop.classList.remove("done", "err");
  drop.setAttribute("aria-busy", "true");
  document.getElementById("busytitle").textContent = title;
  document.getElementById("busysub").textContent = sub || "";
}
function setDone(name) {
  drop.classList.remove("busy", "err");
  drop.classList.add("done");
  drop.removeAttribute("aria-busy");
  document.getElementById("donename").textContent = name;
}
function setIdle(err) {
  drop.classList.remove("busy", "done");
  drop.classList.toggle("err", !!err);
  drop.removeAttribute("aria-busy");
}
function status(msg) { statusEl.textContent = msg || ""; }

async function buildEngine() {
  setBusy("검사 엔진을 준비하고 있습니다.",
          "이 페이지에서 처음 실행할 때는 15–20초 걸릴 수 있습니다.");
  status("실행 환경을 불러오는 중");
  var py = await loadPyodide();
  status("분석 모듈을 불러오는 중");
  await py.loadPackage(["micropip", "lxml", "pillow"]);
  status("검사 규칙을 불러오는 중");
  var mp = py.pyimport("micropip");
  try {
    await mp.install(["python-pptx", "archforge==" + ARCHFORGE_VERSION]);
  } catch (e) {
    // In the minutes after a release, PyPI's index caches can still serve a listing
    // without the pinned version. One quiet retry covers that window.
    await new Promise(function (r) { setTimeout(r, 4000); });
    await mp.install(["python-pptx", "archforge==" + ARCHFORGE_VERSION]);
  }
  return py;
}

function loadEngine() {
  if (!pyReady) {
    pyReady = buildEngine();
    // Reset through a side branch so a failed build never stays cached: the next file
    // selection rebuilds from scratch. Callers still see the original rejection.
    pyReady.catch(function () { pyReady = null; });
  }
  return pyReady;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

function verdictCard(doc, name) {
  var s = doc.summary;
  var kind, title, sub;
  if (s.error_count > 0) {
    kind = "err"; title = "수정이 필요합니다";
    sub = "오류 " + s.error_count + "건 · 경고 " + s.warning_count + "건";
  } else if (s.incomplete) {
    kind = "warn"; title = "일부 항목을 확인하지 못했습니다";
    sub = "확인 필요 · 경고 " + s.warning_count + "건";
  } else {
    kind = "ok"; title = "차단 결함이 없습니다";
    sub = s.warning_count > 0 ? "경고 " + s.warning_count + "건" : "";
  }
  return "<div class='card'><div><h2 class='verdict-title' id='verdict' tabindex='-1'>" +
    "<span class='dot " + kind + "'></span>" + title + "</h2>" +
    (sub ? "<p class='verdict-sub'>" + sub + "</p>" : "") + "</div>" +
    "<div class='meta'><div class='fname'>" + esc(name) + "</div>" +
    "<div class='ver'>archforge " + ARCHFORGE_VERSION + "</div></div></div>";
}

function render(doc, name) {
  var findings = doc.errors.map(function (f) { f.sev = "err"; f.sevKo = "오류"; return f; })
    .concat(doc.warnings.map(function (f) { f.sev = "warn"; f.sevKo = "경고"; return f; }));
  var html = verdictCard(doc, name);
  html += "<div class='findings-head'><h2>발견 항목</h2>" +
    "<a href='https://github.com/Love-Ash/archforge/tree/main/docs/rules'>코드 설명과 수정 방법</a></div>";
  if (findings.length) {
    var rows = findings.map(function (f) {
      return "<tr><td class='t-code'><span class='dot " + f.sev + "'></span>" +
        "<span class='sr'>" + f.sevKo + " </span>" + esc(f.code) + "</td>" +
        "<td class='t-page'>" + (Number(f.page) > 0 ? Number(f.page) + "쪽" : "전체") + "</td>" +
        "<td class='t-msg'>" + esc(f.message) + "</td>" +
        "<td class='t-det'>" + (f.detail ? esc(f.detail) : "—") + "</td></tr>";
    });
    html += "<table><colgroup><col class='c-code'><col class='c-page'><col class='c-msg'><col></colgroup>" +
      "<thead><tr><th scope='col'>코드</th><th scope='col'>페이지</th>" +
      "<th scope='col'>메시지</th><th scope='col'>세부 내용</th></tr></thead>" +
      "<tbody>" + rows.join("") + "</tbody></table>";
  } else {
    html += "<p class='empty'>발견된 항목이 없습니다.</p>";
  }
  document.getElementById("result").innerHTML = html;
  var v = document.getElementById("verdict");
  if (v) { v.focus(); }
}

async function lintFile(file) {
  if (!file) { return; }
  if (!/\.pptx$/i.test(file.name)) { setIdle(true); status("PPTX 파일만 검사할 수 있습니다."); return; }
  document.getElementById("result").innerHTML = "";
  var py;
  try {
    py = await loadEngine();
  } catch (e) {
    setIdle(true);
    status("검사 엔진을 불러오지 못했습니다.\n잠시 후 파일을 다시 선택하면 처음부터 재시도합니다.");
    console.error(e);
    return;
  }
  try {
    setBusy("‘" + file.name + "’ 검사 중…", "");
    status("‘" + file.name + "’ 검사 중…");
    var buf = new Uint8Array(await file.arrayBuffer());
    var b64 = "";
    for (var i = 0; i < buf.length; i += 0x8000) {
      b64 += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    }
    py.globals.set("deck_b64", btoa(b64));
    var res = await py.runPythonAsync(document.getElementById("pycode").textContent);
    var doc = JSON.parse(res);
    setDone(file.name);
    status("검사가 끝났습니다. 오류 " + doc.summary.error_count + "건, 경고 " +
           doc.summary.warning_count + "건.");
    render(doc, file.name);
  } catch (e) {
    setIdle(true);
    status("검사를 완료하지 못했습니다.\n파일이 손상됐거나 올바른 PPTX가 아닐 수 있습니다.");
    console.error(e);
  }
}

document.getElementById("file").addEventListener("change", function (e) { lintFile(e.target.files[0]); });
["dragover", "dragenter"].forEach(function (t) {
  drop.addEventListener(t, function (e) { e.preventDefault(); if (!drop.classList.contains("busy")) drop.classList.add("hot"); });
});
["dragleave", "drop"].forEach(function (t) {
  drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove("hot"); });
});
drop.addEventListener("drop", function (e) {
  if (!drop.classList.contains("busy")) lintFile(e.dataTransfer.files[0]);
});
</script>
</body>
</html>
