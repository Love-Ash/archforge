name: pages

# Publishes web/ to GitHub Pages. The page is one static file that runs the engine in
# WebAssembly, so deployment is an artifact upload and nothing else. Kept as a workflow
# (rather than branch-mode Pages) because branch mode can only serve / or /docs, and the
# app does not belong inside the documentation tree.
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/
      - id: deployment
        uses: actions/deploy-pages@v4
